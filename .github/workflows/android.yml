name: Android APK
# Builds a debug APK that wraps your hosted site. Run it manually and download the artifact.
# Needs the repository variable APP_URL (e.g. https://app.example.com). A Play Store release additionally needs a
# signing keystore stored as secrets; this workflow builds an installable debug APK only.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      APP_URL: ${{ vars.APP_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - name: Fail early without APP_URL
        run: test -n "$APP_URL" || (echo "Set the APP_URL repository variable" && exit 1)
      - run: npx cap add android
      - run: npx cap sync android
      - run: ./gradlew assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: pitchside-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
