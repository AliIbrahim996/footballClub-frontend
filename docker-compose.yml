# Frontend stack. Run: docker compose up --build   ->  http://localhost:3000
#
# No credentials live in this file. By default it expects the API at BACKEND_URL (set below; the API repo's own
# compose publishes it on host port 8000). To run the API + PostgreSQL together from the sibling repo instead,
# use the "with-api" profile and provide the secrets in .env (see .env.example):
#     docker compose --profile with-api up --build
name: pitchside-frontend
services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
        BACKEND_URL: ${BACKEND_URL:-http://host.docker.internal:8000}
        # Build-time switches (see .env.example): closed beta by default, contact by e-mail.
        NEXT_PUBLIC_SIGNUPS_OPEN: ${NEXT_PUBLIC_SIGNUPS_OPEN:-0}
        NEXT_PUBLIC_DESIGNER_ONLY: ${NEXT_PUBLIC_DESIGNER_ONLY:-0}
        NEXT_PUBLIC_CONTACT_MODE: ${NEXT_PUBLIC_CONTACT_MODE:-mailto}
        NEXT_PUBLIC_CONTACT_EMAIL: ${NEXT_PUBLIC_CONTACT_EMAIL:-}
    restart: unless-stopped
    environment:
      BACKEND_URL: ${BACKEND_URL:-http://host.docker.internal:8000}
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3000:3000"

  # --- optional: build and run the Django API + PostgreSQL from ../footballClub-backend ---
  # The secrets default to empty on purpose: the database container and the API both refuse to start without them.
  db:
    profiles: [with-api]
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: footballclub
      POSTGRES_USER: footballclub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U footballclub -d footballclub"]
      interval: 5s
      retries: 10

  backend:
    profiles: [with-api]
    build: ${BACKEND_CONTEXT:-../footballClub-backend}
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      DJANGO_DEBUG: ${DJANGO_DEBUG:-0}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-}
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend
      POSTGRES_HOST: db
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      NUM_PROXIES: "1"
      MEDIA_ROOT: /data/media
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-0}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
    volumes: [media:/data/media]
    ports: ["8000:8000"]

volumes:
  pgdata:
  media:
